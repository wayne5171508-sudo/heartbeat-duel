<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>迷霧森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#04070d; --ink:#dde6e1; --dim:#8a9a93; --amber:#f2b25c; --moss:#7fa88a; --danger:#c2334d; --line:rgba(160,190,175,.18); --card:rgba(10,16,20,.86); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; overflow:hidden; overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
canvas#cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
.serif { font-family:"Noto Serif TC",serif; }
button { font:inherit; color:inherit; border:1px solid var(--line); background:rgba(255,255,255,.05); border-radius:14px; padding:12px 16px; cursor:pointer; }
button:active { transform:scale(.97); }
button.main { background:linear-gradient(180deg,#d99a45,#9a5a1c); border-color:#f2c77e; color:#1a0d02; font-weight:700; box-shadow:0 0 24px rgba(242,178,92,.35); }
button.ghost { background:transparent; }
input { font:inherit; color:var(--ink); background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:12px; padding:11px 14px; width:100%; outline:none; }
input:focus { border-color:var(--amber); }
.screen { position:fixed; inset:0; display:none; overflow-y:auto; touch-action:pan-y; z-index:20; padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom)); background:radial-gradient(ellipse at 50% 0%,rgba(60,90,80,.25),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(242,178,92,.12),transparent 55%),rgba(4,7,13,.82); }
.screen.show { display:block; }
.wrap { max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
h1 { font-family:"Noto Serif TC",serif; font-weight:900; font-size:46px; letter-spacing:8px; margin:18px 0 0; text-align:center; color:#e9efe9; text-shadow:0 0 30px rgba(180,220,200,.35),0 0 2px #fff; animation:breath 5s ease-in-out infinite; }
@keyframes breath { 50% { opacity:.72; letter-spacing:9px; } }
.sub { text-align:center; color:var(--dim); font-size:14px; line-height:1.7; margin:0; }
.lbl { font-size:13px; color:var(--dim); margin-bottom:6px; }
.chars { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chars button { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px; }
.chars button.on { border-color:var(--amber); background:rgba(242,178,92,.12); box-shadow:0 0 18px rgba(242,178,92,.2); }
.chars canvas { width:84px; height:96px; }
.chars small { color:var(--dim); font-size:12px; }
.row { display:flex; gap:10px; } .row > * { flex:1; }
.chaps { display:flex; flex-direction:column; gap:8px; }
.chaps button { text-align:left; display:flex; justify-content:space-between; align-items:center; padding:11px 14px; }
.chaps button.on { border-color:var(--amber); background:rgba(242,178,92,.1); }
.chaps button:disabled { opacity:.38; }
.chaps .t { font-family:"Noto Serif TC",serif; font-weight:700; }
.chaps .s { font-size:12px; color:var(--dim); }
.note { font-size:12.5px; color:var(--dim); line-height:1.7; border:1px dashed var(--line); border-radius:12px; padding:10px 12px; }
.code { font-family:"Noto Serif TC",serif; font-size:44px; letter-spacing:10px; text-align:center; color:var(--amber); text-shadow:0 0 20px rgba(242,178,92,.4); }
.who { display:flex; gap:10px; } .who > div { flex:1; border:1px solid var(--line); border-radius:14px; padding:10px; text-align:center; font-size:14px; }
a.back { color:var(--dim); font-size:13px; text-align:center; text-decoration:none; }

#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
#hud > * { pointer-events:auto; }
#top { position:absolute; top:max(8px,env(safe-area-inset-top)); left:10px; right:10px; display:flex; align-items:center; gap:8px; pointer-events:none; }
#top > * { pointer-events:auto; }
#top button { padding:7px 11px; border-radius:11px; background:rgba(0,0,0,.4); font-size:15px; }
#chap { font-family:"Noto Serif TC",serif; font-size:14px; color:#cfd9d3; text-shadow:0 1px 4px #000; flex:1; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#stat { font-size:13px; color:#cfd9d3; text-shadow:0 1px 4px #000; pointer-events:none; white-space:nowrap; }
#rb { position:absolute; right:max(14px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
#rb .small { display:flex; gap:8px; }
#rb .small button { width:48px; height:48px; padding:0; border-radius:50%; background:rgba(0,0,0,.45); font-size:20px; }
#bAct { width:84px; height:84px; border-radius:50%; padding:0; font-family:"Noto Serif TC",serif; font-size:20px; font-weight:700; background:radial-gradient(circle at 40% 35%,#f6c879,#a5621f); color:#1d0e02; border:2px solid #ffd99a; box-shadow:0 0 26px rgba(242,178,92,.55); display:none; }
#bSwap { display:none; }
#sayMenu { position:absolute; right:max(14px,env(safe-area-inset-right)); bottom:150px; display:none; flex-direction:column; gap:6px; }
#sayMenu button { background:rgba(8,14,18,.9); padding:9px 14px; font-size:14px; text-align:right; }
#netWarn { position:absolute; top:52px; left:50%; transform:translateX(-50%); font-size:12px; color:#ffb3b3; background:rgba(60,0,10,.6); padding:5px 12px; border-radius:20px; display:none; pointer-events:none; }

.overlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(2,4,8,.72); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.overlay.show { display:flex; }
.box { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 20px; max-width:420px; width:100%; max-height:92vh; overflow-y:auto; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 60px rgba(0,0,0,.6); touch-action:pan-y; }
.box h2 { font-family:"Noto Serif TC",serif; margin:0; font-size:26px; text-align:center; letter-spacing:3px; }
.box .poem { font-family:"Noto Serif TC",serif; text-align:center; color:#b9c8c0; font-size:16px; line-height:1.8; margin:0; }
.box ul { margin:0; padding-left:20px; color:#c6d1cb; font-size:14px; line-height:1.75; }
.glyphs { display:flex; justify-content:center; gap:10px; }
.gl { width:62px; display:flex; flex-direction:column; align-items:center; gap:3px; font-family:"Noto Serif TC",serif; font-size:15px; color:#9fe8de; }
.gl svg { width:52px; height:52px; fill:#8ff0e2; filter:drop-shadow(0 0 8px rgba(120,240,225,.7)); }
.slots { display:flex; justify-content:center; gap:8px; }
.slots div { width:54px; height:54px; border-radius:12px; border:1px solid var(--line); background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
.slots svg { width:36px; height:36px; fill:#8ff0e2; }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pad button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px; font-family:"Noto Serif TC",serif; }
.pad svg { width:30px; height:30px; fill:#cfe; }
@media (max-height:520px) {
  .box { padding:14px 16px; gap:8px; max-height:96vh; }
  .box h2 { font-size:20px; } .box .poem { font-size:13.5px; line-height:1.5; } .box ul { font-size:12.5px; line-height:1.5; }
  .pad { grid-template-columns:repeat(6,1fr); } .pad svg { width:24px; height:24px; } .pad button { padding:5px; }
  .slots div { width:44px; height:44px; } .gl svg { width:40px; height:40px; }
  .box button { padding:9px 14px; }
}
#room { position:fixed; inset:0; z-index:25; display:none; background:#070504; }
#room.show { display:block; }
.rhead { position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 18px max(12px,env(safe-area-inset-left)); background:linear-gradient(rgba(5,3,2,.85),rgba(5,3,2,0)); pointer-events:none; }
.rhead > * { pointer-events:auto; }
#rPan { position:absolute; left:50%; transform:translateX(-50%); top:58px; font-size:12px; color:rgba(255,230,190,.75); background:rgba(0,0,0,.45); padding:4px 12px; border-radius:20px; pointer-events:none; white-space:nowrap; }
.rhead b { font-size:18px; letter-spacing:2px; }
.rhead button { padding:8px 14px; font-size:14px; }
#rStage { position:absolute; inset:0; overflow-x:auto; overflow-y:hidden; touch-action:pan-x; scrollbar-width:none; }
#rStage::-webkit-scrollbar { display:none; }
#rcv { position:absolute; border-radius:12px; }
#rHots { position:absolute; }
.hot { position:absolute; transform:translate(-50%,-50%); background:transparent; border:none; padding:0; border-radius:12px; }
.hot i { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px; border-radius:50%; background:radial-gradient(circle,rgba(255,230,170,.95),rgba(255,200,110,0) 70%); animation:twinkle 2.2s ease-in-out infinite; }
.hot.done i { opacity:.25; animation:none; }
.hot:active { background:rgba(255,220,160,.1); }
@keyframes twinkle { 50% { transform:scale(1.7); opacity:.45; } }
.rinv { position:absolute; left:0; right:0; bottom:0; padding:22px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:6px; background:linear-gradient(rgba(5,3,2,0),rgba(5,3,2,.88) 40%); pointer-events:none; }
.rinv > * { pointer-events:auto; } .rinv .sub { text-align:left; pointer-events:none; }
.items { display:flex; flex-wrap:wrap; gap:8px; }
.item { font-size:14px; padding:8px 12px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.05); }
.item.on { border-color:var(--amber); background:rgba(242,178,92,.2); box-shadow:0 0 12px rgba(242,178,92,.35); }
.pad .big, .slots .big { font-size:24px; font-family:Georgia,serif; color:#e9dcc0; }
.sw { display:inline-block; width:24px; height:24px; border-radius:6px; box-shadow:inset 0 0 0 2px rgba(0,0,0,.3); }
.pad.p-digit { grid-template-columns:repeat(5,1fr); } .pad.p-dir { grid-template-columns:repeat(4,1fr); }
.slots div { width:min(54px,14vw); height:min(54px,14vw); flex:none; }
#toast { position:fixed; left:50%; top:22%; transform:translateX(-50%); z-index:40; background:rgba(6,10,14,.88); border:1px solid var(--line); color:var(--ink); padding:10px 18px; border-radius:24px; font-size:14px; display:none; pointer-events:none; text-align:center; max-width:86vw; font-family:"Noto Serif TC",serif; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="top"><button id="bMenu">☰</button><div id="chap"></div><div id="stat"></div><button id="bSnd">🔊</button></div>
  <div id="netWarn">對方的訊號斷斷續續…</div>
  <div id="sayMenu"></div>
  <div id="rb">
    <button id="bAct"></button>
    <div class="small"><button id="bBag" title="背包">🎒</button><button id="bSwap" title="換人">⇄</button><button id="bSay" title="說話">💬</button><button id="bPing" title="標記位置">📍</button></div>
  </div>
</div>

<div id="home" class="screen show"><div class="wrap">
  <h1>迷霧森林</h1>
  <p class="sub serif">起霧了。牽好對方的手，別走散。<br>兩個人、兩盞燈籠，一起找到森林的出口。</p>
  <div><div class="lbl">你的名字</div><input id="name" maxlength="8" placeholder="輸入名字"></div>
  <div><div class="lbl">選你的樣子</div><div class="chars" id="chars"></div></div>
  <div><div class="lbl">章節</div><div class="chaps" id="chaps"></div></div>
  <button class="main" id="bHost">開房間，邀請另一半</button>
  <div class="row"><input id="joinCode" maxlength="5" placeholder="房間代碼" style="text-transform:uppercase"><button id="bJoin">加入</button></div>
  <button class="ghost" id="bTimed"></button>
  <button class="ghost" id="bSolo">一個人先探路（兩隻輪流操控）</button>
  <div class="note">🎧 建議戴耳機，並且<b>開著通話</b>一起玩：石碑上的符文只有一個人看得到，要唸給對方聽。<br>操作：左半邊螢幕拖曳移動，右下角按鈕互動。電腦可用 WASD／方向鍵、E 互動、Q 標記。</div>
  <a class="back" href="./">← 回到心跳對決</a>
</div></div>

<div id="lobby" class="screen"><div class="wrap">
  <h1 style="font-size:34px">等待會合</h1>
  <div class="lbl" style="text-align:center">房間代碼</div>
  <div class="code" id="codeShow"></div>
  <button id="bShare">傳連結給對方</button>
  <div class="who"><div id="whoA"></div><div id="whoB"></div></div>
  <div id="hostOnly"><div class="lbl">從哪一章開始</div><div class="chaps" id="chaps2"></div></div>
  <button class="main" id="bStart">走進森林</button>
  <p class="sub" id="lobbyMsg"></p>
  <button class="ghost" id="bLeave">離開</button>
</div></div>

<div id="card" class="overlay"><div class="box" id="cardBox"></div></div>
<div id="modal" class="overlay"><div class="box" id="modalBox"></div></div>
<div id="room"><div id="rStage"><canvas id="rcv"></canvas><div id="rHots"></div></div><div id="rPan">← 左右滑動，看看整個房間 →</div><div class="rhead"><div><b id="rTitle" class="serif"></b><div id="rMate" class="sub" style="text-align:left"></div></div><button id="rLeave">離開小屋</button></div>
  <div class="rinv"><div id="rItems" class="items"></div><div id="rHint" class="sub"></div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const T = 48, DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ================= 存檔 =================
const SAVE_KEY = 'misty-forest-v1';
let S = { name: '', char: 'rabbit', unlocked: 1, chap: 0, sound: true, best: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ================= 符文 =================
const GLYPHS = [
  { n: '月', d: 'M15 3a9 9 0 1 0 6 15A7 7 0 1 1 15 3z' },
  { n: '星', d: 'M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z' },
  { n: '眼', d: 'M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z' },
  { n: '樹', d: 'M12 2l7 9h-4l5 7h-6v4h-4v-4H4l5-7H5z' },
  { n: '火', d: 'M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z' },
  { n: '心', d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z' },
];
const glyphSVG = i => `<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="${GLYPHS[i].d}"/></svg>`;
const GLYPH_PATHS = GLYPHS.map(g => new Path2D(g.d));
function runeCode(id) {
  const R = mulberry32((world.seed ^ hashStr(id)) >>> 0), pool = [0, 1, 2, 3, 4, 5], c = [];
  while (c.length < 4) c.push(pool.splice(Math.floor(R() * pool.length), 1)[0]);
  return c;
}

// ================= 章節 =================
// grid 每一格是一個「房間格」，同一個字母是同一區；每區各自長出迷宮，區和區之間只靠 links 相通
const LEVELS = [
  { name: '走散', seed: 1101, light: 4.6, dark: .93, braid: .3,
    poem: '起霧了。<br>回過神來，牽著的那隻手不見了。',
    tips: ['你們從森林的兩端出發，要在中間會合，再一起走到發光的出口', '<b>小木屋</b>：走到門口按「進入」，點房間裡發亮的地方調查。<b>你的鎖，線索常常在對方那間</b>', '<b>紫色石板</b>：站上去，某處的荊棘門就會打開；一離開就關上', '<b>霧牆</b>擋住出口，聽說鈴聲能讓霧散去'],
    grid: ['AAAAACCCCBBBBB', 'AAAAACCCCBBBBB', 'AAAAACCCCBBBBB', 'AAAAACCCCBBBBB', 'AAAAACCCCBBBBB', 'AAAAACCCCBBBBB', 'AAAAACXXCBBBBB'],
    spawn: { P1: 'A', P2: 'B' }, exit: 'X',
    links: [{ a: 'A', b: 'C', k: 'gate', id: 'g1' }, { a: 'B', b: 'C', k: 'gate', id: 'g2' }, { a: 'C', b: 'X', k: 'seal', id: 's1', need: 'bellFull' }],
    things: [{ t: 'plate', in: 'C', opens: 'g1' }, { t: 'plate', in: 'A', opens: 'g2' }, { t: 'cabin', in: 'A', room: 'A' }, { t: 'cabin', in: 'B', room: 'B' }],
    shadows: {} },
  { name: '符文', seed: 2207, light: 4.4, dark: .94, braid: .25,
    poem: '石碑上刻著發光的記號。<br>答案，總在另一個人那裡。',
    tips: ['走到<b>石碑</b>旁按「看」，記住四個符號：月、星、眼、樹、火、心', '<b>石門</b>在另一個人那邊，要靠你唸給對方聽', '小木屋裡的保險箱放著<b>鑰匙</b>，可是密碼被撕成了兩半', '輸錯不會怎樣，只是……森林會笑'],
    grid: ['AAAACCCCCBBBB', 'AAAACCCCCBBBB', 'AAAACCCCCBBBB', 'AAAADDDDDBBBB', 'AAAADDDDDBBBB', 'AAAADDDDDBBBB', 'AAAADDDDDBBBB'],
    spawn: { P1: 'A', P2: 'B' }, exit: 'D',
    links: [{ a: 'B', b: 'C', k: 'rune', id: 'r1' }, { a: 'A', b: 'C', k: 'gate', id: 'g1' }, { a: 'C', b: 'D', k: 'door', id: 'd1' }],
    things: [{ t: 'stone', in: 'A', rune: 'r1' }, { t: 'plate', in: 'C', opens: 'g1' }, { t: 'cabin', in: 'A', room: 'A' }, { t: 'cabin', in: 'B', room: 'B' }],
    shadows: {} },
  { name: '影子', seed: 3313, light: 4.0, dark: .95, braid: .3,
    poem: '有什麼東西，<br>一直跟在樹的後面。',
    tips: ['這次要<b>分頭</b>走，各自找到小木屋，替對方打開前面的荊棘門', '<b>影子</b>靠近時會聽到心跳；被碰到會被拖回最近的營火', '<b>營火、石板</b>旁邊影子不敢靠近；在小木屋裡也很安全', '出口前的霧牆，要拼好的護身符才打得開'],
    grid: ['LLLLLSSSSRRRRR', 'LLLLLSSSSRRRRR', 'LLLLLSSSSRRRRR', 'LLLLLSSSSRRRRR', 'MMMMMMXXNNNNNN', 'MMMMMMXXNNNNNN', 'MMMMMMXXNNNNNN', 'MMMMMMXXNNNNNN', 'MMMMMMXXNNNNNN'],

function buildLevel(n) {
  const spec = LEVELS[n], R = mulberry32(spec.seed), grid = spec.grid;
  const CW = grid[0].length, CH = grid.length, W = CW * 2 + 1, H = CH * 2 + 1;
  const tiles = new Uint8Array(W * H).fill(1), reg = new Array(W * H).fill('');
  const cr = (cx, cy) => cx >= 0 && cy >= 0 && cx < CW && cy < CH ? grid[cy][cx] : '';

  const wall = (cx, cy, dx, dy) => (cy * 2 + 1 + dy) * W + cx * 2 + 1 + dx;
  const seen = new Set();
  for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) {
    if (seen.has(cy * CW + cx)) continue;
    const r = grid[cy][cx], stack = [[cx, cy]]; seen.add(cy * CW + cx); tiles[ti(cx, cy)] = 0; reg[ti(cx, cy)] = r;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const nb = DIRS.filter(([dx, dy]) => cr(x + dx, y + dy) === r && !seen.has((y + dy) * CW + x + dx));
      if (!nb.length) { stack.pop(); continue; }
      const [dx, dy] = nb[Math.floor(R() * nb.length)], a = x + dx, b = y + dy;
      seen.add(b * CW + a); tiles[wall(x, y, dx, dy)] = 0; reg[wall(x, y, dx, dy)] = r; tiles[ti(a, b)] = 0; reg[ti(a, b)] = r; stack.push([a, b]);
    }
  }
  // 打掉一些死路，讓迷宮有迴圈，不會只剩一條路
  for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) {
    const r = grid[cy][cx], open = DIRS.filter(([dx, dy]) => cr(cx + dx, cy + dy) === r && !tiles[wall(cx, cy, dx, dy)]);
    if (open.length !== 1 || R() > spec.braid) continue;
    const closed = DIRS.filter(([dx, dy]) => cr(cx + dx, cy + dy) === r && tiles[wall(cx, cy, dx, dy)]);
    if (closed.length) { const [dx, dy] = closed[Math.floor(R() * closed.length)]; tiles[wall(cx, cy, dx, dy)] = 0; reg[wall(cx, cy, dx, dy)] = r; }
  }
  const links = [], linkAt = {}, ent = {};
  const addEnt = (r, i) => (ent[r] = ent[r] || []).push(i);
  for (const lk of spec.links) {
    const cand = [];
    for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) if (grid[cy][cx] === lk.a)
      for (const [dx, dy] of DIRS) if (cr(cx + dx, cy + dy) === lk.b) cand.push({ i: wall(cx, cy, dx, dy), ca: ti(cx, cy), cb: ti(cx + dx, cy + dy), dx, dy });
    const c = cand[Math.floor(R() * cand.length)];
    const o = { ...lk, i: c.i, x: c.i % W, y: Math.floor(c.i / W), horiz: c.dx !== 0, ca: c.ca, cb: c.cb };
    tiles[c.i] = 0;
    if (lk.k !== 'open') linkAt[c.i] = o;
    links.push(o); addEnt(lk.a, c.ca); addEnt(lk.b, c.cb);

  const isFloor = i => !tiles[i];
  function dist(r, src) {
    const d = new Int32Array(W * H).fill(-1), q = [];

    for (let h = 0; h < q.length; h++) {
      const i = q[h];
      for (const [dx, dy] of DIRS) { const j = i + dx + dy * W; if (d[j] < 0 && isFloor(j) && reg[j] === r && !linkAt[j]) { d[j] = d[i] + 1; q.push(j); } }
    }
    return d;
  }
  const cellsOf = r => { const out = []; for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) if (grid[cy][cx] === r) out.push(ti(cx, cy)); return out; };
  const deadEnd = i => DIRS.filter(([dx, dy]) => isFloor(i + dx + dy * W)).length === 1;
  const used = new Set(links.flatMap(l => [l.ca, l.cb]));
  const farthest = r => { const d = dist(r, ent[r] || [cellsOf(r)[0]]); let best = -1, bi = cellsOf(r)[0]; for (const i of cellsOf(r)) if (d[i] > best && !used.has(i)) { best = d[i]; bi = i; } return bi; };
  const spawn = {}; spawn.P1 = farthest(spec.spawn.P1); used.add(spawn.P1);
  spawn.P2 = spec.spawn.P2 === spec.spawn.P1 ? spawn.P1 : farthest(spec.spawn.P2); used.add(spawn.P2);
  const exit = farthest(spec.exit); used.add(exit);
  for (const r of Object.values(spec.spawn)) addEnt(r, r === spec.spawn.P1 ? spawn.P1 : spawn.P2);
  function place(r, lo, hi) {
    const d = dist(r, ent[r] || []), cs = cellsOf(r).filter(i => !used.has(i) && d[i] > 0).sort((a, b) => d[a] - d[b]);
    let pool = cs.slice(Math.floor(cs.length * lo), Math.max(Math.floor(cs.length * lo) + 1, Math.ceil(cs.length * hi)));
    const de = pool.filter(deadEnd); if (de.length) pool = de;
    const i = pool[Math.floor(R() * pool.length)]; used.add(i); return i;
  }
  const things = spec.things.map((t, k) => {
    let i = place(t.in, t.t === 'plate' ? .3 : t.t === 'cabin' ? .4 : .6, t.t === 'plate' ? .75 : 1);
    if (t.t === 'cabin') {   // 小屋蓋在路旁的樹叢裡，門朝著路（優先蓋在路的上方）
      const j = [[0, -1], [1, 0], [-1, 0], [0, 1]].map(([dx, dy]) => i + dx + dy * W).find(j => tiles[j] === 1);

  for (let i = 0; i < W * H; i++) if (safeSpots.some(f => Math.hypot(f.x - i % W, f.y - Math.floor(i / W)) < 2.6)) used.add(i);
  for (const [r, n] of Object.entries(spec.shadows))
    for (let k = 0; k < n; k++) { const i = place(r, .45, 1); shadowSpawns.push({ x: i % W, y: Math.floor(i / W), reg: r }); }
  const mush = [], trees = [], block = new Set(things.filter(t => t.t === 'cabin').map(t => t.i));
  for (let i = 0; i < W * H; i++) {
    if (isFloor(i) && !used.has(i) && !linkAt[i] && R() < .045) mush.push({ x: i % W, y: Math.floor(i / W), h: R() });
    if (!isFloor(i) && !block.has(i) && !block.has(i - 1) && !block.has(i + 1) && R() < .38) trees.push({ x: i % W, y: Math.floor(i / W), v: Math.floor(R() * 5), s: .85 + R() * .3 });
  }
  const xy = i => ({ x: i % W, y: Math.floor(i / W) });
  return { n, spec, W, H, tiles, reg, links, linkAt, things, block, spawn: { P1: xy(spawn.P1), P2: xy(spawn.P2) }, exit: xy(exit), fires, shadowSpawns, mush, trees };
}

function pickItem(it) {

  const r = RECIPES.findIndex(r => (r.a === selItem && r.b === it) || (r.b === selItem && r.a === it));

function hotAction(o) {

    else { toast('沒有反應……'); Snd.sfx('bad'); }

  const draw = () => { $('slots').innerHTML = code.map((_, k) => `<div>${cur[k] != null ? face(cur[k]) : ''}</div>`).join(''); };
  draw();
  $('pad').onclick = e => { const b = e.target.closest('button'); if (!b || cur.length >= code.length) return; cur.push(+b.dataset.v); Snd.sfx('step'); draw(); };
  $('mDel').onclick = () => { cur.pop(); draw(); };
  $('mTry').onclick = () => {
    if (cur.length < code.length) return toast('還沒填滿');
    if (cur.every((v, i) => v === code[i])) { act({ a: 'solve', f: o.id, give: L.give }); closeModal(); }
    else { Snd.sfx('bad'); toast('喀。鎖沒有動……'); cur.length = 0; draw(); }

// ================= 世界狀態（房主說了算）=================
let mode = null;            // 'solo' | 'host' | 'guest'
let world = null, Lv = null, loadedRun = null;
let players = [], active = 0, me = null, mate = null;
let shadows = [], linkState = {}, lvT0 = 0, myCaught = 0, mateCaught = 0;
let names = { P1: '', P2: '' }, chars = { P1: 'rabbit', P2: 'fox' }, roomCode = '', guestId = null;
const mySlot = () => mode === 'guest' ? 'P2' : 'P1';

function newWorld(lv) {
  return { lv, run: Math.random().toString(36).slice(2, 8), seed: Math.floor(Math.random() * 1e9), levers: {}, keys: 0, taken: {}, doors: {}, runes: {}, flags: {}, items: [], seals: {}, timer: S.timed ? 20 * 60 : 0, clear: null, t0: Date.now() };
}
function mkPlayer(slot) {
  const sp = Lv.spawn[slot], off = Lv.spec.spawn.P1 === Lv.spec.spawn.P2 ? (slot === 'P1' ? -.18 : .18) : 0;
  return { slot, x: sp.x + .5 + off, y: sp.y + .5, tx: sp.x + .5 + off, ty: sp.y + .5, dir: 'down', moving: false, ph: 0, cp: { x: sp.x + .5 + off, y: sp.y + .5 }, caught: 0, say: null, sayT: 0, fireSeen: {}, inRoom: null };
}
function loadLevel() {
  if (roomOpen()) closeRoom();
  Lv = buildLevel(world.lv); loadedRun = world.run; lvT0 = performance.now(); myCaught = 0; mateCaught = 0;
  players = [mkPlayer('P1'), mkPlayer('P2')];
  active = mode === 'guest' ? 1 : 0; setMeMate();
  let resumed = false;
  try { const sp = JSON.parse(sessionStorage.getItem('mf-pos') || 'null'); if (sp && sp.run === world.run && mode !== 'solo') { me.x = me.tx = sp.x; me.y = me.ty = sp.y; me.cp = sp.cp; resumed = true; } } catch (e) {}
  shadows = Lv.shadowSpawns.map((s, k) => ({ id: k, x: s.x + .5, y: s.y + .5, hx: s.x + .5, hy: s.y + .5, rx: s.x + .5, ry: s.y + .5, reg: s.reg, gone: 0, tgt: null, chase: false, spd: 1.35 }));
  linkState = {}; for (const l of Lv.links) linkState[l.id] = linkOpen(l);
  ground = null; groundKey = '';
  cam.x = me.x; cam.y = me.y;
  $('chap').textContent = `第${'一二三四五'[world.lv]}章・${Lv.spec.name}`;
  $('bSwap').style.display = mode === 'solo' ? 'block' : 'none';
  show(null); if (resumed) { hideCard(); toast('回到森林裡了'); } else showIntro();
  Snd.start();
}
function oilLeft() { return world && world.timer ? Math.max(0, world.timer - (Date.now() - world.t0) / 1000) : null; }
function setMeMate() { me = players[active]; mate = players[1 - active]; }

function plateDown(t) { return players.some(p => p && Math.hypot(p.x - t.x - .5, p.y - t.y - .5) < .48); }
function linkOpen(l) {
  if (l.k === 'open') return true;
  if (l.k === 'rune') return !!world.runes[l.id];
  if (l.k === 'door') return !!world.doors[l.id];
  if (l.k === 'seal') return !!world.seals[l.id];
  return Lv.things.some(t => t.opens === l.id && (t.t === 'plate' ? plateDown(t) : !!world.levers[t.id]));
}
function solid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= Lv.W || ty >= Lv.H) return true;
  const i = ty * Lv.W + tx;
  if (Lv.tiles[i] || Lv.block.has(i)) return true;
  const l = Lv.linkAt[i]; return !!(l && !linkState[l.id]);
}
const PR = .27;
function hits(x, y, ign) {
  for (let ty = Math.floor(y - PR); ty <= Math.floor(y + PR); ty++) for (let tx = Math.floor(x - PR); tx <= Math.floor(x + PR); tx++) {
    if (!solid(tx, ty) || ign.has(ty * Lv.W + tx)) continue;
    const cx = clamp(x, tx, tx + 1), cy = clamp(y, ty, ty + 1);
    if ((x - cx) ** 2 + (y - cy) ** 2 < PR * PR) return true;
  }
  return false;
}
// 撞牆時，如果旁邊不遠處有開口，就把人往開口滑過去（轉彎不用對很準）
function slideTo(v, free) {
  const c0 = Math.floor(v) + .5, c1 = c0 + (v > c0 ? 1 : -1);
  for (const c of [c0, c1]) if (Math.abs(c - v) > .01 && Math.abs(c - v) < .72 && free(c)) return c;
  return null;
}
function moveP(p, dx, dy) {
  const ign = new Set();   // 門在你身上關起來時，不會把你卡死
  for (let ty = Math.floor(p.y - PR); ty <= Math.floor(p.y + PR); ty++) for (let tx = Math.floor(p.x - PR); tx <= Math.floor(p.x + PR); tx++) if (solid(tx, ty)) ign.add(ty * Lv.W + tx);
  if (dx) {
    if (!hits(p.x + dx, p.y, ign)) p.x += dx;
    else { const c = slideTo(p.y, v => !hits(p.x + dx, v, ign)); if (c != null) p.y += Math.sign(c - p.y) * Math.min(Math.abs(c - p.y), Math.abs(dx)); }
  }
  if (dy) {
    if (!hits(p.x, p.y + dy, ign)) p.y += dy;
    else { const c = slideTo(p.x, v => !hits(v, p.y + dy, ign)); if (c != null) p.x += Math.sign(c - p.x) * Math.min(Math.abs(c - p.x), Math.abs(dy)); }
  }
}

// 互動：拉桿、石碑、石門、木門
function nearest() {
  if (!me || me.caught) return null;
  let best = null, bd = 9;
  const consider = (o, d, label) => { if (d < bd) { bd = d; best = { ...o, label }; } };
  for (const t of Lv.things) {
    const d = Math.hypot(me.x - t.x - .5, me.y - t.y - .5);
    if (t.t === 'lever' && d < 1.3) consider({ kind: 'lever', t }, d, world.levers[t.id] ? '推回' : '拉下');
    if (t.t === 'stone' && d < 1.3) consider({ kind: 'stone', t }, d, '看');
    if (t.t === 'cabin' && d < 1.4) consider({ kind: 'cabin', t }, d - .2, '進入');
  }
  for (const l of Lv.links) {
    if (l.k !== 'rune' && l.k !== 'door' && l.k !== 'seal' || linkState[l.id]) continue;
    const d = Math.hypot(me.x - l.x - .5, me.y - l.y - .5);
    if (d < 1.35) consider({ kind: l.k, l }, d, l.k === 'rune' ? '解鎖' : l.k === 'seal' ? '霧牆' : '開門');
  }
  return best;
}
function doAct() {
  const n = nearest(); if (!n) return;
  if (n.kind === 'lever') { act({ a: 'lever', id: n.t.id }); Snd.sfx('lever'); }
  else if (n.kind === 'stone') showStone(n.t.rune);
  else if (n.kind === 'rune') showLock(n.l.id);
  else if (n.kind === 'cabin') openRoom(n.t.room);
  else if (n.kind === 'seal') {
    if (world.items.includes(n.l.need)) act({ a: 'seal', id: n.l.id });
    else readBox(`一道濃得化不開的<b>霧牆</b>，擋住了去路。<br>${{ bellFull: '旁邊的木牌寫著：「鈴聲，能讓霧散去。」', charm: '霧牆上浮著一個圓形的凹痕，像在等一塊護身符。', rings: '霧牆中間有一扇門，門上有兩個小小的、圓形的凹槽。' }[n.l.need]}`);
  }
  else if (n.kind === 'door') { if (world.keys > 0) act({ a: 'door', id: n.l.id }); else { toast('門鎖著……要找到鑰匙'); Snd.sfx('bad'); } }
}
function act(a) { if (mode === 'guest') send({ type: 'a', run: world.run, ...a }); else applyAct(a); }
function applyAct(a) {
  if (a.run && a.run !== world.run) return;
  if (a.a === 'lever') world.levers[a.id] = !world.levers[a.id];
  else if (a.a === 'key') { if (world.taken[a.id]) return; world.taken[a.id] = 1; world.keys++; event({ e: 'key' }); }
  else if (a.a === 'door') { if (world.keys <= 0 || world.doors[a.id]) return; world.keys--; world.doors[a.id] = 1; event({ e: 'door' }); }
  else if (a.a === 'rune') {
    if (world.runes[a.id]) return;
    const ok = runeCode(a.id).every((v, i) => v === a.g[i]);
    if (ok) world.runes[a.id] = 1;
    event({ e: ok ? 'runeOk' : 'runeBad' });
  }
  else if (a.a === 'solve' || a.a === 'take') { if (world.flags[a.f]) return; world.flags[a.f] = 1; if (a.give === 'key') world.keys++; else world.items.push(a.give); event({ e: 'got', it: a.give }); }
  else if (a.a === 'use') { if (world.flags[a.f] || !world.items.includes(a.need)) return; world.flags[a.f] = 1; world.items = world.items.filter(x => x !== a.need); event({ e: 'used' }); }
  else if (a.a === 'combine') { const r = RECIPES[a.r]; if (!r || !world.items.includes(r.a) || !world.items.includes(r.b)) return; world.items = world.items.filter(x => x !== r.a && x !== r.b); world.items.push(r.out); event({ e: 'combined', r: a.r }); }
  else if (a.a === 'seal') { const l = Lv.links.find(l => l.id === a.id); if (!l || world.seals[a.id] || !world.items.includes(l.need)) return; world.seals[a.id] = 1; event({ e: 'seal' }); }
  else if (a.a === 'next') { if (world.clear) nextChapter(); return; }
  else if (a.a === 'restart') { startChapter(world.lv); return; }
  pushWorld(); renderRoomUI(); renderBag();
}
function event(ev) { if (mode !== 'solo') send({ type: 'ev', run: world.run, ...ev }); onEvent(ev, true); }
function onEvent(ev) {
  if (ev.e === 'key') { Snd.sfx('key'); toast('🗝️ 撿到鑰匙了（兩個人共用）'); }
  else if (ev.e === 'door') { Snd.sfx('door'); toast('木門打開了'); }
  else if (ev.e === 'runeOk') { Snd.sfx('rune'); toast('石門沉了下去……'); closeModal(); }
  else if (ev.e === 'runeBad') { Snd.sfx('bad'); toast('符文不對。樹林裡有東西在笑……'); }
  else if (ev.e === 'caught') { mateCaught++; toast(`${names[mate.slot] || '對方'}被影子拖走了……`); }
  else if (ev.e === 'ping') { pings.push({ x: ev.x, y: ev.y, t: 0, mine: false }); Snd.sfx('ping'); }
  else if (ev.e === 'got') { Snd.sfx('key'); toast(`得到了：${ev.it === 'key' ? '🗝️ 舊鑰匙' : ITEMS[ev.it].e + ' ' + ITEMS[ev.it].n}`); }
  else if (ev.e === 'used') { Snd.sfx('rune'); toast('油燈亮了……燈籠也跟著亮了起來'); }
  else if (ev.e === 'combined') { Snd.sfx('rune'); toast(`${ITEMS[RECIPES[ev.r].out].e} ${RECIPES[ev.r].text}`, 3800); }
  else if (ev.e === 'seal') { Snd.sfx('rune'); toast('霧牆慢慢散開了……'); }
  else if (ev.e === 'say') { mate.say = PHRASES[ev.i]; mate.sayT = 4; Snd.sfx('ping'); }
}
function pushWorld() { if (mode === 'host') { send({ type: 'w', w: world, names, chars }); sess.set({ mode, roomCode, world, names, chars }); } }

// ================= 影子 =================
function shadeFloor(i, reg) {

  openModal(`<h2>暫停</h2>
    <button id="mCp">回到最近的營火（卡住時用）</button>
    <button id="mRe">${mode === 'guest' ? '請房主重來這一章' : '重來這一章'}</button>
    <button id="mHome" class="ghost">離開，回到首頁</button>
    <button class="main" id="mBack">繼續</button>`);
  $('mCp').onclick = () => { me.x = me.cp.x; me.y = me.cp.y; closeModal(); };
  $('mRe').onclick = () => { act({ a: 'restart' }); closeModal(); };
  $('mHome').onclick = () => { closeModal(); leave(); };
  $('mBack').onclick = closeModal;
};

// ================= 畫面切換、卡片 =================
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id));
  $('hud').style.display = id ? 'none' : 'block';
}
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
const modalOpen = () => $('modal').classList.contains('show') || $('room').classList.contains('show');
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('show'); stick.id = null; }
function closeModal() { $('modal').classList.remove('show'); }
function showCard(html) { $('cardBox').innerHTML = html; $('card').classList.add('show'); stick.id = null; }
function hideCard() { $('card').classList.remove('show'); }
function showIntro() {
  const sp = Lv.spec;
  showCard(`<div class="lbl" style="text-align:center">第${'一二三四五'[world.lv]}章</div><h2>${sp.name}</h2><p class="poem">${sp.poem}</p><ul>${sp.tips.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="sub">${mode === 'solo' ? '一個人玩：按 ⇄ 切換兩隻角色' : `你是 <b>${HERO[chars[mySlot()]].name}</b>，${names[mate.slot] || '對方'}是 ${HERO[chars[mate.slot]].name}`}</p>
    <button class="main" id="cGo">走進森林</button>`);
  $('cGo').onclick = () => { hideCard(); Snd.start(); };
}
function showClear() {
  const c = world.clear, last = world.lv >= LEVELS.length - 1;
  S.unlocked = Math.max(S.unlocked, Math.min(LEVELS.length, world.lv + 2)); S.best[world.lv] = Math.min(S.best[world.lv] || 1e9, c.t); persist();
  Snd.sfx('clear');
  const mm = `${Math.floor(c.t / 60)} 分 ${c.t % 60} 秒`;
  if (last) showCard(`<h2>走出森林了</h2><p class="poem">${ENDING}</p><p class="sub">最後一章：${mm}・被影子抓走 ${c.caught} 次</p><button class="main" id="cHome">回到首頁</button>`);
  else showCard(`<div class="lbl" style="text-align:center">第${'一二三四五'[world.lv]}章</div><h2>找到出口了</h2><p class="poem">霧裡，你們又牽到了彼此的手。</p>
    <p class="sub">花了 ${mm}・被影子抓走 ${c.caught} 次</p>
    <button class="main" id="cNext">${mode === 'guest' ? '前往下一章' : '前往下一章'}</button><button class="ghost" id="cHome">先休息，回首頁</button>`);
  if ($('cNext')) $('cNext').onclick = () => { act({ a: 'next' }); $('cNext').textContent = '等對方……'; };
  $('cHome').onclick = () => { hideCard(); leave(); };
}
function showStone(rid) {
  const code = runeCode(rid);
  openModal(`<h2>石碑</h2><p class="poem">冰冷的石頭上，刻著四個發光的記號。<br>記下來，唸給對方聽。</p>
    <div class="glyphs">${code.map(i => `<div class="gl">${glyphSVG(i)}${GLYPHS[i].n}</div>`).join('')}</div>
    <p class="sub">順序：${code.map(i => GLYPHS[i].n).join('・')}</p><button class="main" id="mOk">記住了</button>`);
  $('mOk').onclick = closeModal;
}
function showLock(lid) {
  const cur = [];
  openModal(`<h2>石門</h2><p class="poem">門上有四個凹槽。<br>要照順序放進正確的符文。</p><div class="slots" id="slots"></div>
    <div class="pad" id="pad">${GLYPHS.map((g, i) => `<button data-i="${i}">${glyphSVG(i)}${g.n}</button>`).join('')}</div>
    <div class="row"><button id="mDel">⌫ 刪掉</button><button class="main" id="mTry">放進去</button></div><button class="ghost" id="mX">先離開</button>`);
  const draw = () => { $('slots').innerHTML = [0, 1, 2, 3].map(k => `<div>${cur[k] != null ? glyphSVG(cur[k]) : ''}</div>`).join(''); };
  draw();
  $('pad').onclick = e => { const b = e.target.closest('button'); if (!b || cur.length >= 4) return; cur.push(+b.dataset.i); Snd.sfx('step'); draw(); };
  $('mDel').onclick = () => { cur.pop(); draw(); };
  $('mTry').onclick = () => { if (cur.length < 4) { toast('還有凹槽是空的'); return; } act({ a: 'rune', id: lid, g: cur.slice() }); cur.length = 0; draw(); };
  $('mX').onclick = closeModal;
}

// ================= 首頁 =================
let pickChap = Math.min(S.chap || 0, S.unlocked - 1);
function renderHome() {
  $('name').value = S.name;
  $('chars').innerHTML = '';
  for (const k of ['rabbit', 'fox']) {
    const b = document.createElement('button'); b.className = S.char === k ? 'on' : '';
    const c = document.createElement('canvas'); c.width = 168; c.height = 192; b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<b class="serif">${HERO[k].name}</b><small>${k === 'rabbit' ? '紅色兜帽・暖黃燈籠' : '夜色斗篷・蓬鬆尾巴'}</small>`);
    b.onclick = () => { S.char = k; persist(); renderHome(); };
    $('chars').appendChild(b);
    const g = c.getContext('2d'); g.scale(2, 2);
    const gr = g.createRadialGradient(42, 56, 4, 42, 56, 50); gr.addColorStop(0, 'rgba(255,200,120,.35)'); gr.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, 84, 96);
    g.translate(42, 88); g.scale(1.55, 1.55); drawHero(g, k, 'down', 0, false, 0, false);
  }
  renderChaps($('chaps'));
}
function renderChaps(el) {
  el.innerHTML = LEVELS.map((L, i) => `<button data-i="${i}" class="${i === pickChap ? 'on' : ''}" ${i >= S.unlocked ? 'disabled' : ''}>
    <span><span class="t">第${'一二三四五'[i]}章・${L.name}</span><br><span class="s">${i >= S.unlocked ? '🔒 先通過前一章' : L.poem.replace('<br>', '')}</span></span><span class="s">${S.best[i] ? '⏱ ' + Math.floor(S.best[i] / 60) + ':' + String(S.best[i] % 60).padStart(2, '0') : ''}</span></button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; pickChap = +b.dataset.i; S.chap = pickChap; persist(); renderChaps($('chaps')); renderChaps($('chaps2')); };
}
function renderTimed() { $('bTimed').textContent = S.timed ? '⏳ 限時模式：開（每章燈油 20 分鐘，用完燈籠會只剩微光）' : '⏳ 限時模式：關'; }
$('bTimed').onclick = () => { S.timed = !S.timed; persist(); renderTimed(); };
renderTimed();
$('bBag').onclick = () => openBag();
$('name').oninput = () => { S.name = $('name').value.trim(); persist(); };
function myName() { return S.name || HERO[S.char].name; }

function startChapter(lv) {
  world = newWorld(lv); clearShown = null;
  if (mode === 'host') pushWorld();
  loadLevel();
}
function nextChapter() { startChapter(world.lv + 1); }
$('bSolo').onclick = () => {
  Snd.start(); mode = 'solo'; names = { P1: '', P2: '' };
  chars = { P1: S.char, P2: S.char === 'rabbit' ? 'fox' : 'rabbit' };
  startChapter(pickChap);
};

// ================= 連線（公開 MQTT 中繼，兩個 broker 同時送）=================
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
let myId = '';
try { myId = sessionStorage.getItem('mf-id') || ''; } catch (e) {}
if (!myId) { myId = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('mf-id', myId); } catch (e) {} }
// 這個分頁的連線狀態：重新整理時用來自動回到同一個房間、同一個位置
const sess = {
  get() { try { return JSON.parse(sessionStorage.getItem('mf-sess') || 'null'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('mf-sess', JSON.stringify(v)); } catch (e) {} },
  clear() { try { sessionStorage.removeItem('mf-sess'); sessionStorage.removeItem('mf-pos'); } catch (e) {} },
};
let net = null, timers = [];
function connectRoom(code) {
  disconnect();
  const topic = 'misty-forest/v1/' + code;
  net = { clients: [], topic, seq: 0, seen: new Set(), lastHeard: Date.now() };
  for (const url of BROKERS) {
    try {
      const c = mqtt.connect(url, { clientId: 'mf_' + myId + '_' + Math.random().toString(36).slice(2, 6), clean: true, connectTimeout: 8000, reconnectPeriod: 2500 });
      c.on('connect', () => c.subscribe(topic, { qos: 0 }));
      c.on('message', (t, buf) => {
        let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
        if (!net || m.from === myId) return;
        if (m.type !== 'p' && m.type !== 'sh') { if (net.seen.has(m.k)) return; net.seen.add(m.k); if (net.seen.size > 600) net.seen = new Set([...net.seen].slice(-250)); }
        net.lastHeard = Date.now();
        onMsg(m);
      });
      net.clients.push(c);
    } catch (e) {}
  }
}
function send(m) {
  if (!net) return;
  m.from = myId; m.k = myId + ':' + (++net.seq);
  const s = JSON.stringify(m);
  for (const c of net.clients) if (c.connected) c.publish(net.topic, s, { qos: 0 });
}
function disconnect() { if (net) for (const c of net.clients) try { c.end(true); } catch (e) {} net = null; timers.forEach(clearInterval); timers = []; }
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

function onMsg(m) {
  if (m.to && m.to !== myId) return;
  if (mode === 'host') {
    if (m.type === 'join') {
      if (guestId && guestId !== m.from && Date.now() - guestHeard < 10000 && names.P2) return send({ type: 'full', to: m.from });
      guestId = m.from; names.P2 = m.name || HERO[chars.P2].name;
      send({ type: 'welcome', to: m.from }); pushWorld(); renderLobby();
      if (world && Lv) toast(`${names.P2} 進到森林裡了`);
      return;
    }
    if (!guestId && names.P2 && m.type !== 'bye') guestId = m.from;   // 房主重新整理後，認回原本的另一半
    if (m.from !== guestId) return;
    guestHeard = Date.now();
    if (m.type === 'a') applyAct(m);
    else if (m.type === 'caught') { const s = shadows[m.sid]; if (s && m.run === world.run) s.gone = 4; mateCaught++; toast(`${names.P2}被影子拖走了……`); }
  } else if (mode === 'guest') {
    if (m.type === 'welcome') { joined = true; }
    else if (m.type === 'full') { toast('這個房間已經有兩個人了'); leave(); return; }
    else if (m.type === 'w') {
      joined = true; names = m.names; chars = m.chars;
      const prev = world; world = m.w;
      if (!world) { renderLobby(); show('lobby'); return; }
      if (world.run !== loadedRun) { clearShown = null; hideCard(); loadLevel(); }
      else { renderRoomUI(); renderBag(); }
      return;
    }
    else if (m.type === 'lobby') { joined = true; names = m.names; chars = m.chars; renderLobby(); return; }
    else if (m.type === 'sh' && world && m.run === world.run) { m.a.forEach((v, k) => { const s = shadows[k]; if (!s) return; s.rx = v[0]; s.ry = v[1]; if (v[2] && s.gone <= 0) { s.x = v[0]; s.y = v[1]; } s.gone = v[2] ? 1 : 0; s.chase = !!v[3]; if (Math.hypot(s.x - s.rx, s.y - s.ry) > 2) { s.x = s.rx; s.y = s.ry; } }); }
  }
  if (m.type === 'p' && world && m.run === world.run && mate) {
    mate.tx = m.x; mate.ty = m.y; mate.dir = m.d; mate.moving = !!m.m; mate.caught = m.c ? 1.1 : 0; if ((mate.inRoom || '') !== (m.r || '')) { mate.inRoom = m.r || null; renderRoomUI(); }
    if (Math.hypot(mate.x - m.x, mate.y - m.y) > 3) { mate.x = m.x; mate.y = m.y; }
  }
  else if (m.type === 'ev' && world && m.run === world.run) onEvent(m);
  else if (m.type === 'bye') { toast('對方離開森林了', 3500); }
}
let joined = false, guestHeard = 0;
$('bHost').onclick = () => {
  Snd.start(); mode = 'host'; roomCode = genCode(); guestId = null; world = null;
  names = { P1: myName(), P2: '' }; chars = { P1: S.char, P2: S.char === 'rabbit' ? 'fox' : 'rabbit' };
  connectRoom(roomCode);
  timers.push(setInterval(() => { if (world) pushWorld(); else send({ type: 'lobby', names, chars }); }, 2000));
  history.replaceState(null, '', location.pathname + '?room=' + roomCode);
  sess.set({ mode, roomCode, world: null, names, chars });
  renderLobby(); show('lobby');
};
function guestJoin(code) {
  Snd.start(); mode = 'guest'; roomCode = code.toUpperCase().trim(); world = null; joined = false;
  connectRoom(roomCode); sess.set({ mode, roomCode });
  history.replaceState(null, '', location.pathname + '?room=' + roomCode);
  const join = () => send({ type: 'join', name: myName(), char: S.char });
  timers.push(setInterval(() => { if (!joined) join(); }, 1000));
  timers.push(setInterval(() => { if (!Lv) send({ type: 'hb' }); }, 3000));
  join(); renderLobby(); show('lobby');
}
$('bJoin').onclick = () => { const c = $('joinCode').value.trim(); if (c.length < 4) return toast('輸入對方給你的房間代碼'); guestJoin(c); };
function renderLobby() {
  $('codeShow').textContent = roomCode;
  const host = mode === 'host';
  const tag = (slot, nm) => nm ? `${HERO[chars[slot]].name}<br><b>${nm}</b>` : '<span style="color:var(--dim)">等待中……</span>';
  $('whoA').innerHTML = tag('P1', names.P1); $('whoB').innerHTML = tag('P2', names.P2);
  $('hostOnly').style.display = host ? 'block' : 'none'; $('bStart').style.display = host ? 'block' : 'none';
  $('bShare').style.display = host ? 'block' : 'none';
  $('lobbyMsg').textContent = host ? (names.P2 ? '另一半到了。準備好就走進森林吧。' : '把代碼或連結傳給對方，等對方加入。') : (joined ? '已連上，等房主帶你走進森林……' : '連線中……');
  if (host) renderChaps($('chaps2'));
}
$('bStart').onclick = () => { if (!names.P2) { toast('另一半還沒加入喔'); return; } startChapter(pickChap); };
$('bShare').onclick = async () => {
  const url = location.origin + location.pathname + '?room=' + roomCode;
  try { if (navigator.share) await navigator.share({ title: '迷霧森林', text: '陪我走進迷霧森林，房間代碼 ' + roomCode, url }); else { await navigator.clipboard.writeText(url); toast('連結已複製'); } } catch (e) {}
};
$('bLeave').onclick = () => leave();
function leave() {
  if (net) send({ type: 'bye' });
  setTimeout(disconnect, 200);
  mode = null; world = null; Lv = null; players = []; me = mate = null; shadows = []; loadedRun = null;
  hideCard(); if (roomOpen()) closeRoom(); closeModal(); sess.clear(); history.replaceState(null, '', location.pathname);
  renderHome(); show('home');
}

// ================= 啟動 =================
renderHome();
const qr = new URLSearchParams(location.search).get('room');
const old = sess.get();
if (qr && old && old.roomCode === qr && old.mode === 'guest') guestJoin(qr);
else if (qr && old && old.roomCode === qr && old.mode === 'host') resumeHost(old);
else if (qr) { $('joinCode').value = qr; toast('輸入名字、選好角色，按「加入」'); }
function resumeHost(o) {
  mode = 'host'; roomCode = o.roomCode; names = o.names; chars = o.chars; world = o.world; guestId = null;
  connectRoom(roomCode);
  timers.push(setInterval(() => { if (world) pushWorld(); else send({ type: 'lobby', names, chars }); }, 2000));
  if (world) loadLevel(); else { renderLobby(); show('lobby'); }
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  try { if (Lv && world) update(dt, now); if (roomOpen()) drawRoom(now / 1000); else render(now); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
