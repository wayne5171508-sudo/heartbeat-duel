const SPY_W = [['營火', '烤肉'], ['啤酒', '可樂'], ['帳篷', '蚊帳'], ['手電筒', '頭燈'], ['棉花糖', '巧克力'], ['香腸', '熱狗'], ['蚊子', '蒼蠅'], ['星星', '月亮'], ['登山', '健行'], ['溪邊', '海邊'], ['睡袋', '棉被'], ['泡麵', '拉麵'], ['初戀', '暗戀'], ['前任', '曖昧對象'], ['接吻', '擁抱'], ['夜店', 'KTV'], ['高鐵', '火車'], ['咖啡', '奶茶'], ['麻辣鍋', '薑母鴨'], ['火鍋', '燒烤'], ['鬼故事', '恐怖片'], ['露營車', '小木屋'], ['烤地瓜', '烤玉米'], ['蟑螂', '老鼠'], ['婚禮', '求婚'], ['生日', '聖誕節'], ['海灘', '泳池'], ['刺青', '耳洞'], ['威士忌', '高粱'], ['自拍', '合照'], ['宵夜', '早餐'], ['外送', '外帶']];

const EVENTS = [

// ================= 存檔 =================
const KEY = 'campfire-night-v1';

// ================= 聲音 =================
let ac = null, nb = null;
function au() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, dur, g = .15, type = 'square', f2) {
  if (!au()) return; const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, g = .5, f = 800) {
  if (!au()) return; const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), v = ac.createGain();
  s.buffer = nb; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f, t); fl.frequency.exponentialRampToValueAtTime(60, t + dur);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl); fl.connect(v); v.connect(ac.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  tick: () => tone(1200, .05, .12), tock: () => tone(800, .05, .1),

  bad: () => tone(160, .5, .25, 'sawtooth', 70),
  roll: () => tone(500 + Math.random() * 400, .04, .08),
  alarm: () => { for (let i = 0; i < 4; i++) setTimeout(() => tone(1000, .12, .2, 'square'), i * 150); },
  go: () => { tone(660, .15, .15); setTimeout(() => tone(990, .3, .18), 120); },

};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ================= 共用畫面 =================

const P = () => S.players;
const nm = i => esc(P()[i].name);
// 讓大家選人（輸家）
function pickNames({ title, sub = '', multi = false, all = false, none = false }) {
  return new Promise(res => {

async function runEvent() {
  const ev = pick(EVENTS);
  SFX.alarm(); buzz([200, 100, 200, 100, 200]); flash('rgba(255,46,61,.55)', 700);
  const king = P().reduce((b, p, i) => p.pts > P()[b].pts ? i : b, 0);

  if (ev.k === 'all') return { losers: P().map((_, i) => i), fixed: 0, title: '敬營火' };
  if (ev.k === 'rand') { const who = shuffle(P().map((_, i) => i)).slice(0, ev.n); return { losers: who, title: '天選之人' }; }
  if (ev.k === 'timer') {
    let caught = null;
    await new Promise(res => { let left = ev.s; V(`<div class="col" style="min-height:60dvh;justify-content:center"><div class="q" style="font-size:22px">${ev.t}</div><div class="huge" id="ec">${left}</div><button class="big" id="eCaught">抓到了！</button></div>`);
      const h = setInterval(() => { left--; $('ec') && ($('ec').textContent = left); SFX.tick(); if (left <= 0) { clearInterval(h); res(); } }, 1000);
      on('eCaught', () => { clearInterval(h); caught = true; res(); }); });
    SFX.alarm();
    const who = await pickNames({ title: caught ? '誰犯規了？' : '時間到！有誰犯規？', multi: true, none: true });
    return { losers: who, title: '突發事件' };
  }
  return { losers: await pickNames({ title: '誰要喝？', multi: !!ev.multi, none: !!ev.multi }), title: '突發事件' };
}

    S.round++; S.sinceEvent++;
    if (S.round > 1 && S.round % 8 === 1) {
      await new Promise(res => { V(`<div class="col" style="min-height:66dvh;justify-content:center"><div class="huge">💧</div><h2>喝水時間</h2><p class="q" style="font-size:22px">所有人喝一杯水再繼續！<br>（真的喝，明天才起得來）</p><button class="main big" id="wOk">大家都喝了 ✔</button></div>`); on('wOk', res); SFX.ding(); });
    }
    let r;
    if (S.sinceEvent >= 3 && Math.random() < .35) { S.sinceEvent = 0; r = await runEvent(); }
    else {
      const ids = (S.games && S.games.length ? S.games : GAME_IDS).filter(id => GAMES[id]);
      let id;
      for (let tries = 0; tries < 20; tries++) { id = pick(ids); if (id !== S.last || ids.length === 1) break; }
      // 抽遊戲的轉場
      V(`<div class="col" style="min-height:66dvh;justify-content:center"><p class="sub">第 ${S.round} 輪</p><div class="huge" id="sl" style="font-size:90px">🎲</div><h2 id="sn"></h2></div>`);
      for (let k = 0; k < 12; k++) { const g = GAMES[pick(GAME_IDS)]; $('sl').textContent = g.e; $('sn').textContent = g.n; SFX.roll(); await sleep(45 + k * 14); }
      $('sl').textContent = GAMES[id].e; $('sn').textContent = GAMES[id].n; SFX.go(); await sleep(700);
      S.last = id;
      r = await GAMES[id].run(GAMES[id]);
      if (r === 'skip') { S.round--; busy = false; return home(); }
    }
    const res = Array.isArray(r) ? { losers: r } : r;
    if (res.losers && res.losers.length) await penalty(res.losers, res);
    persist();
  } catch (e) { console.error(e); }
  busy = false; home();
}

function home() {
  if (!S.started) return setup();
  const king = P().reduce((b, p, i) => p.pts > P()[b].pts ? i : b, 0), any = P().some(p => p.pts > 0);
  V(`<div class="top"><div class="t">🔥 營火之夜</div><button id="hBoard">🏆 排行</button><button id="hSet">⚙️</button></div>
    <h1>第 ${S.round + 1} 輪</h1>
    <p class="sub">${any ? `目前酒王：👑 <b style="color:var(--fire2)">${nm(king)}</b>（${P()[king].pts} 點）` : '還沒有人喝，準備好了嗎？'}</p>
    <div class="col" style="margin-top:18px">
      <button class="main" id="hGo" style="font-size:34px;padding:42px 10px;border-radius:30px">🔥 下一輪</button>
      <div class="card col"><div class="lbl">這輪要玩哪些？（不選就全部隨機）</div><div class="chips" id="hGames">${GAME_IDS.map(id => `<button data-id="${id}" class="${S.games && S.games.includes(id) ? 'on' : ''}">${GAMES[id].e} ${GAMES[id].n}</button>`).join('')}</div>
        <div class="row"><button id="hEvent">⚠️ 直接來個突發事件</button></div></div>
      <div class="note">🍺 抿一口=1 點、一口=2、半杯=4、乾杯=8。每人今晚上限 ${S.cap ? S.cap + ' 點' : '不限'}，到了就自動改做替代懲罰。每 8 輪強制喝水。</div>
      <a class="back" href="./">← 回到心跳對決</a></div>`);
  on('hGo', nextRound);
  on('hBoard', board); on('hSet', setup);
  $('hGames').onclick = e => { const b = e.target.closest('button'); if (!b) return; const id = b.dataset.id; S.games = S.games || []; S.games.includes(id) ? S.games.splice(S.games.indexOf(id), 1) : S.games.push(id); persist(); b.classList.toggle('on'); };
  on('hEvent', async () => { if (busy) return; busy = true; au(); try { const r = await runEvent(); if (r.losers && r.losers.length) await penalty(r.losers, r); persist(); } catch (e) { console.error(e); } busy = false; home(); });
}
function board() {
  const rows = P().map((p, i) => ({ p, i })).sort((a, b) => b.p.pts - a.p.pts), max = Math.max(1, ...P().map(p => p.pts));
  showOv(`<h2>🏆 今晚排行</h2><div class="board">${rows.map(({ p, i }, k) => `<div><span style="width:26px">${k === 0 && p.pts ? '👑' : k + 1}</span><b>${nm(i)}${p.sober ? ' 🙅' : ''}</b><span style="text-align:right;min-width:84px">${p.pts} 點<br><small style="color:var(--dim)">輸 ${p.losses}・替代 ${p.subs}</small></span></div><div class="bar" style="width:${p.pts / max * 100}%;padding:0;margin:-4px 0 4px"></div>`).join('')}</div>
    <button class="main" id="bClose">回去繼續</button>`);
  on('bClose', hideOv);
}
function setup() {
  const draw = () => {
    V(`<h1>營火之夜</h1><p class="sub">露營專用・一支手機主持全場<br>輸的人，命運決定你喝多少 🔥</p>
      <div class="col" style="margin-top:16px">
        <div class="card col"><div class="lbl">玩家（<b>照座位順時針</b>輸入，數字炸彈、快問快答會照這個順序輪）</div>
          <div class="plist" id="pl">${P().map((p, i) => `<div class="prow"><input data-i="${i}" value="${esc(p.name)}" maxlength="8"><button data-s="${i}" class="${p.sober ? 'on' : ''}">${p.sober ? '🙅 不喝' : '🍺 喝'}</button><button data-x="${i}">✕</button></div>`).join('')}</div>
          <button id="sAdd">＋ 加一個人</button></div>
        <div class="card col"><div class="lbl">喝多猛？（影響轉盤的機率）</div><div class="seg" id="sInt">${[['mild', '溫和'], ['normal', '正常'], ['crazy', '瘋狂']].map(([k, n]) => `<button data-k="${k}" class="${S.intensity === k ? 'on' : ''}">${n}</button>`).join('')}</div>
          <div class="lbl">每人今晚上限（到了自動改做替代懲罰）</div><div class="seg" id="sCap">${[[20, '20 點'], [30, '30 點'], [45, '45 點'], [0, '不限']].map(([k, n]) => `<button data-k="${k}" class="${S.cap === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
        <button class="main big" id="sGo">${S.started ? '回到遊戲' : '開始！'}</button>
        ${S.started ? '<button class="ghost" id="sReset">今晚重新開始（分數歸零）</button>' : ''}
        <div class="note">🔌 營地可能沒有訊號：出發前先用這支手機打開這頁一次，之後沒網路也能玩。<br>🔦 遊戲中螢幕會保持亮著。<br>🙅 不喝酒的人按「不喝」，輸了會改做替代懲罰。<br>⚠️ 喝酒不開車、不下水，營火旁邊注意安全。</div>
        <a class="back" href="./">← 回到心跳對決</a></div>`);
    $('pl').oninput = e => { const i = e.target.dataset.i; if (i != null) { P()[+i].name = e.target.value.trim() || '玩家' + (+i + 1); persist(); } };
    $('pl').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.s != null) { const p = P()[+b.dataset.s]; p.sober = !p.sober; persist(); draw(); }
      if (b.dataset.x != null) { if (P().length <= 3) return toast('至少要 3 個人'); P().splice(+b.dataset.x, 1); persist(); draw(); }
    };
    on('sAdd', () => { if (P().length >= 16) return; P().push({ name: '玩家' + (P().length + 1), sober: false, pts: 0, losses: 0, subs: 0 }); persist(); draw(); });
    $('sInt').onclick = e => { const b = e.target.closest('button'); if (b) { S.intensity = b.dataset.k; persist(); draw(); } };
    $('sCap').onclick = e => { const b = e.target.closest('button'); if (b) { S.cap = +b.dataset.k; persist(); draw(); } };
    on('sGo', () => { S.started = true; persist(); au(); keepAwake(); home(); });
    on('sReset', () => { if (!confirm('分數全部歸零，重新開始？')) return; P().forEach(p => { p.pts = 0; p.losses = 0; p.subs = 0; }); S.round = 0; S.sinceEvent = 0; persist(); draw(); });
  };
  draw();
}
home();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('camp-sw.js').catch(() => {});
</script>
</body>
</html>
